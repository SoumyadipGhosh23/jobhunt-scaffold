# Daily job-search preferences. Values are matched case-insensitively.

resume:
  path: SoumyadipGhosh_Resume_Main.pdf

locations:
  # First choice: Kolkata, major North Indian cities, and remote anywhere.
  preferred:
    - kolkata
    - delhi
    - delhi ncr
    - new delhi
    - gurgaon
    - gurugram
    - noida
    - greater noida
    - ghaziabad
    - faridabad

  remote_keywords:
    - remote
    - worldwide
    - anywhere
    - work from home
    - wfh
    - distributed
    - home based
    - telecommute
  # Second choice.
  secondary:
    - bengaluru
    - bangalore
    - hyderabad
    - secunderabad
  # Third choice: other major Indian technology and business hubs.
  tertiary:
    - mumbai
    - navi mumbai
    - pune
    - chennai
    - ahmedabad
    - gandhinagar
    - indore
    - kochi
    - cochin
    - coimbatore
    - bhubaneswar
    - thiruvananthapuram
    - trivandrum
    - surat
    - vadodara
    - nagpur
    - goa
    - mysuru
    - mysore
    - chandigarh
    - mohali
    - panchkula
    - jaipur
    - lucknow
    - dehradun
    - salt lake
    - rajarhat
    - new town
    - howrah
  allow_remote_worldwide: true
  allow_india_unspecified: true

# Broad deterministic pre-filter. DeepSeek performs the resume-specific match.
role_keywords:
  include:
    - frontend
    - front-end
    - full stack
    - full-stack
    - fullstack
    - software engineer
    - software developer
    - sde
    - product engineer
    - web developer
    - react
    - angular
    - next.js
    - node
    - java
    - spring boot
    - mern
    - mean
  reject:
    - intern
    - internship
    - trainee
    - fresher
    - manager
    - director
    - vice president
    - vp
    - principal
    - architect
    - staff engineer
    - qa
    - sdet
    - devops
    - sre
    - android
    - ios
    - flutter
    - salesforce
    - sap
    - wordpress
    - php
    - sales
    - recruiter
    - recruitment

salary:
  currency: INR
  minimum_lpa: 8
  preferred_lpa: 10
  allow_undisclosed: true

sources:
  ats_boards: true
  adzuna: true
  jooble: true
  remotive: true
  remoteok: true
  hn_hiring: true
  email_bridge: false # LinkedIn/Naukri/etc. email alerts; separate credentialed phase.

# Adzuna free tier: one India request per city, maximum five cities per run.
adzuna_cities:
  - Kolkata
  - Delhi
  - Gurugram
  - Noida
  - Bengaluru

jooble_locations:
  - India
  - Remote

rank:
  provider: deepseek
  model: deepseek-v4-flash
  min_score_to_report: 60
  secondary_min_score: 70
  tertiary_min_score: 78
  candidate_limit: 60
  batch_size: 12
  max_jobs_in_report: 15
