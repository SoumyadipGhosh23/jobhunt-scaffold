# ATS board tokens. Token is usually the lowercase company slug from their careers URL.
# Run `npm run verify` after adding companies — it pings each board and flags dead tokens.
# This is a small starter seed; expand toward ~60 as you find companies you'd apply to.

greenhouse:
  - stripe
  - figma
  - postman

lever: []

ashby:
  - linear
  - vercel
  - ramp

workable:
  # add tokens as you find them — Workable boards are less standardized
  []
