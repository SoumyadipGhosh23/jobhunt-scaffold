# jobhunt config — tune these once you see real output

locations:
  tier_a: # full weight, always surface
    - kolkata
    - salt lake
    - rajarhat
    - new town
    - howrah
    - delhi
    - new delhi
    - gurgaon
    - gurugram
    - noida
    - greater noida
    - ghaziabad
    - faridabad
    - remote
  tier_b: # only if exceptional
    - bengaluru
    - bangalore
    - hyderabad
  tier_b_score_threshold: 80
  blocked: # rejected unless remote
    - pune
    - mumbai
    - chennai
    - ahmedabad
    - indore
    - jaipur

